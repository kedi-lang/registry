<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Browse verified packages for the Kedi programming language."
    />
    <meta name="theme-color" content="#111513" />
    <title>kedi registry</title>
    <link rel="icon" href="/assets/kedi-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="kedi registry home">
        <img src="/assets/kedi-logo.svg" alt="" width="36" height="30" />
        <span class="brand-name">kedi</span>
        <span class="brand-section">Package Registry</span>
      </a>
      <nav class="site-nav" aria-label="Registry navigation">
        <button id="theme-toggle" type="button" aria-label="Switch theme">Theme</button>
        <a href="https://kedi-lang.org/">kedi-lang.org</a>
        <a href="https://github.com/kedi-lang/registry">GitHub</a>
      </nav>
    </header>

    <nav class="index-navigation" aria-label="Package index">
      <div>
        <a class="current" href="/">Package index</a>
        <a href="https://github.com/kedi-lang/registry/blob/main/README.md#register-a-package">Submit a package</a>
        <a href="https://docs.kedi-lang.org/">Documentation</a>
        <a href="https://discord.gg/cuSbZd5he">Community</a>
      </div>
    </nav>

    <main id="app" tabindex="-1">
      <div class="loading-shell" aria-live="polite">
        <span class="loading-pixel" aria-hidden="true"></span>
        <p>Opening the package depot...</p>
      </div>
    </main>

    <footer class="site-footer">
      <div>
        <strong>kedi registry</strong>
        <span>A little more Kedi, shared by everyone.</span>
      </div>
      <a href="https://kedi-lang.org/">kedi-lang.org</a>
    </footer>
  </body>
</html>
